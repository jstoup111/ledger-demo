# Project config — <repo>/.ai-conductor/config.yml

harness_version: ">=0.99.0"

# --- Provider routing --------------------------------------------------------
# Codex writes the code; Claude makes the judgement calls.
#
# Provider order: codex first, claude as fallback, for every step except the
# DECIDE/gating steps pinned below — those stay on claude explicitly. This
# mirrors reporting_app's routing so behavior transfers between the two repos.
#
# Each fallback provider resolves its OWN native defaults for model, effort, and
# escalation; nothing leaks across from the provider that failed. Cross-provider
# fallback fires only on run-wide provider unavailability or complete exhaustion
# of a provider's native model ladder — never on ordinary failure, auth error,
# rate limit, timeout, or rejection. Every transition logs a warning naming the
# step, the failed provider, and the reason.
#
# Build is pinned to Codex's balanced Terra model at medium effort. This keeps
# the implementation lane economical while retaining the retry-escalation
# ladder for failed attempts.
#
# CAUTION: the array form above is mutually exclusive with a `steps.build.tdd`
# block. That block's validation reads the TOP-LEVEL llm_provider and requires it
# to be a string, so adding one here fails config validation with
# "steps.build.tdd requires llm_provider to be a string". Per-TDD-phase
# (red/green) model control would mean collapsing this to a scalar provider and
# inverting every pin below.
llm_provider: [codex, claude]

steps:
  # BUILD — the implementation lane. Provider stays codex (inherited from the
  # top-level array's first entry); only the model and effort are pinned, which
  # makes the worktree's intended baseline explicit.
  build:
    model: gpt-5.6-terra
    effort: medium

  # DECIDE — requirements, design, and traceability judgement. Wrong output here
  # cascades into every downstream step, so it stays on claude.
  explore:
    llm_provider: claude
  prd:
    llm_provider: claude
  architecture_review:
    llm_provider: claude
  conflict_check:
    llm_provider: claude
  coherence_check:
    llm_provider: claude

  # Acceptance specs are treated as judgement, not implementation: the step turns
  # acceptance criteria into assertions, and a mis-read criterion produces a test
  # that passes for the wrong reason.
  acceptance_specs:
    llm_provider: claude

  # Gates that render a verdict on work already done.
  build_review:
    llm_provider: claude
  prd_audit:
    llm_provider: claude
  architecture_review_as_built:
    llm_provider: claude

  # Semantic conflict resolution — a wrong merge can silently revert completed
  # work, which is a judgement failure rather than a coding one.
  rebase:
    llm_provider: claude

  finish:
    llm_provider: codex

# Everything not pinned above runs on codex, notably: build (the TDD/pipeline
# implementation lane), stories, plan, complexity, architecture_diagram,
# wiring_check, manual_test, retro, remediate, and attribution_verify.
# `test_suite` and `worktree` are mechanical and dispatch no model at all.

# Required for the native pre-SHIP aggregate gate. Without it the gate reports
# `missing_config: Project config must declare test_suite` and the SHIP tail
# cannot complete.
#
# `go test ./...` is the whole authoritative suite — unit tests alongside their
# packages plus the acceptance specs under acceptance/ — so one command composes
# everything with no per-suite composition needed.
#
# 120s is deliberately near the real runtime rather than generous: the ceiling
# exists to catch a WEDGED run, not a slow one, and a ceiling far above the true
# cost cannot tell the two apart. Measured 2.5s warm on a fresh worktree; a cold
# build cache is the only real variable, and that stays well inside 120s. The
# project convention already caps the suite at 10s (CLAUDE.md), so if this
# timeout ever starts firing on a healthy run, the suite has outgrown a
# convention rather than the timeout being wrong.
test_suite:
  command: make test
  scoped_command: go test {selectors}
  working_directory: .
  timeout_seconds: 120

# --- Acceptance-spec discovery -----------------------------------------------
# The specs live in test/acceptance/, which the acceptance_specs gate's BUILT-IN
# globs already match (test/acceptance/**/*). There is deliberately NO
# acceptance_spec_globs override here, and re-adding one is the wrong fix.
#
# Why this needs saying: the gate's built-in globs are Ruby/JS-shaped
# (spec/acceptance/**, spec/requests/**, test/**, *.test.ts …) and match no
# top-level acceptance/ directory. On 2026-08-08 that made the gate report "no
# acceptance spec files present" while 39KB of correct, correctly-RED Go specs
# sat in acceptance/ — burning two full provider attempts before the step
# relocated them here.
#
# An override cannot fix it from inside the failing step: project config is
# cached at daemon session start, so a mid-session acceptance_spec_globs commit
# never reaches the gate. Relocating the specs is what actually works, which is
# why they are where they are. Do not move them back.
#
# For reference, project globs are APPENDED to the built-ins (engine:
# extraArtifactGlobs + findArtifactFiles), never substituted — so an override
# would not have broken test/acceptance/. It would simply have been dead weight
# pointing at an empty directory.

# complexity:
#   default_tier: M
